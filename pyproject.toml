[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-aiida"
authors = [
    { name = "AiiDA Team", email = "developers@aiida.net" },
]
description = "The Apache Airflow provider for AiiDA"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3.11",
]
dynamic = [
    "version"
]
requires-python = ">=3.11.0,<3.12.0"
dependencies = [
    "apache-airflow>=3.1.0",
    "aiida-core @ git+https://github.com/aiidateam/aiida-core@airflow-dev"
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.urls]
Homepage = "..." # TODO
Source = "..." # TODO

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.entry-points.apache_airflow_provider]
provider_info = "airflow_provider_aiida.__init__:get_provider_info"

[project.entry-points."aiida.dags"]
aiida-standard = "airflow_provider_aiida.example_dags"

[project.entry-points."airflow.plugins"]
aiida_dag_run_listener = "airflow_provider_aiida.plugins.provenance_listener:ProvenanceListenerPlugin"

[tool.hatch.version]
path = "src/airflow_provider_aiida/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
python = "3.11"

[tool.hatch.envs.hatch-test]
default-args = ["tests"]
dependencies = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    # NOTE: these are requirements only needed with psql
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11"]

[tool.hatch.envs.hatch-test.env-vars]
AIRFLOW_HOME = "{root}/.pytest/airflow"
AIRFLOW_PROVIDER_AIIDA__POSTGRES_HOST_PORT = "5434"
AIRFLOW__DATABASE__SQL_ALCHEMY_CONN = "postgresql+psycopg2://airflow:airflow@127.0.0.1:5434/airflow"
AIRFLOW__CORE__DAGS_FOLDER = "{root}/src/airflow_provider_aiida/example_dags"
AIRFLOW__CORE__LOAD_EXAMPLES = "False"
AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS = "False"
AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST = '[{{"name":"dags-folder","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{{}}}},{{"name":"aiida_dags","classpath":"airflow_provider_aiida.bundles.aiida_dag_bundle.AiidaDagBundle","kwargs":{{}}}}]'

[tool.hatch.envs.hatch-test.scripts]
# Start Airflow services (for integration testing)
scheduler = "airflow scheduler"
api-server = "airflow api-server"
triggerer = "airflow triggerer"
dag-processor = "airflow dag-processor"

# Run integration tests
integration = "pytest -m integration tests"

# Clean test artifacts
clean = [
    "rm -rf .pytest",
    "echo 'Cleaned .pytest directory'",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "aiida_provider.__version__" }

[tool.setuptools.packages.find]
exclude = [
    "*tests.*",
    "*tests"
]

[tool.pytest.ini_options]
filterwarnings = [
    # AiiDA SQLAlchemy warnings - these are expected and safe to ignore as done in aiida-core
    "ignore:Object of type .* not in session, .* operation along .* will not proceed:sqlalchemy.exc.SAWarning",
    "ignore:Identity map already had an identity for .* inside of an event handler within the flush?:sqlalchemy.exc.SAWarning",
    # AiiDA configuration warnings in test environments
    "ignore:Creating AiiDA configuration folder.*:UserWarning",
    # Airflow deprecation warnings
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:DeprecationWarning",
]
